<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account, Team Checker & Players</title>

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <!-- Bootstrap for pills -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Optional CSS -->
    <link rel="stylesheet" href="style.css">
</head>
    <body>
    <div class="sticker sticker1"></div>
    <div class="sticker sticker2"></div>

    <div class="sticker-label sticker1-label">Evangelista</div>
    <div class="sticker-label sticker2-label">Garabiles</div>
    <!-- ACCOUNT CREATION / LOGIN -->
    <div id="account-section" class="container mt-4">
        <h1 class="title">4CE55 T3RM1N4L</h1>

        <form class="form-box mt-3">
            <input type="text" id="username" placeholder="Us3rnam3">
            <input type="password" id="password" placeholder="Pa55w0rd">
            <button type="button" py-click="checking_account" class="btn btn-primary mt-2">
                Cr3at3 Acc0unt
            </button>
        </form>
        <div id="account-output" class="mt-2"></div>
    </div>

    <!-- TABS: TEAM CHECKER / PLAYERS LIST -->
    <div id="tabs-section" class="container mt-4" style="display:none;">
        <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="team-tab" data-bs-toggle="pill" data-bs-target="#team-content" type="button" role="tab">
                    Team Checker
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="players-tab" data-bs-toggle="pill" data-bs-target="#players-content" type="button" role="tab">
                    Players List
                </button>
            </li>
        </ul>
        <div class="tab-content" id="pills-tabContent">
            <!-- Team Checker -->
            <div class="tab-pane fade show active" id="team-content" role="tabpanel">
                <h3><strong>Team Checker</strong></h3>
                </h3>
                <form>
                    <input type="radio" id="regist_yes" value="Yes" name="registration">
                    <label for="regist_yes">Yes, I have registered.</label><br>
                    <input type="radio" id="regist_no" value="No" name="registration">
                    <label for="regist_no">No, I have not registered yet</label><br><br>

                    <input type="radio" id="medical_yes" value="Yes" name="clear">
                    <label for="medical_yes">Yes, I have a medical clearance</label><br>
                    <input type="radio" id="medical_no" value="No" name="clear">
                    <label for="medical_no">No, I do not have a medical clearance</label><br><br>

                    <label for="level">Choose your Level</label>
                    <select id="level" name="level">
                        <option value="lg">Lower Grade</option>
                        <option value="7">Grade 7</option>
                        <option value="8">Grade 8</option>
                        <option value="9">Grade 9</option>
                        <option value="10">Grade 10</option>
                        <option value="hg">Higher Grade</option>
                    </select><br><br>

                    <label for="section">Choose your section</label>
                    <select id="section" name="section">
                        <option value="R">Ruby</option>
                        <option value="T">Topaz</option>
                        <option value="S">Sapphire</option>
                        <option value="E">Emerald</option>
                    </select><br><br>

                    <input type="button" py-click="check_team" value="Compute" class="btn btn-success">
                </form>
                <div id="output" class="mt-2"></div>
                <div id="image" class="mt-2"></div>
            </div>

            <!-- Players List -->
            <div class="tab-pane fade" id="players-content" role="tabpanel">
                <h3><strong>Players List</strong></h3>
                <form class="mt-2">
                    <input type="button" py-click="players_list" value="Check List" class="btn btn-info">
                </form>
                <div id="result" class="mt-2"></div>
            </div>
        </div>
    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
